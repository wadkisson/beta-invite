<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pumpkin</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .prompt {
      margin: 0;
      color: #ff8a1f;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(32px, 5vw, 64px);
      letter-spacing: 0.03em;
      text-align: center;
    }

    body.is-carving .prompt {
      animation: flash 1.1s steps(1, end) infinite;
    }

    body.is-breaking .prompt {
      animation: fade-out 0.35s linear forwards;
    }

    .pumpkin-stage {
      position: relative;
      width: min(62vmin, 520px);
      aspect-ratio: 400 / 460;
    }

    .person-layer,
    .pumpkin-stage > .pumpkin {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .person-layer {
      z-index: 0;
      pointer-events: none;
    }

    .pumpkin-stage > .pumpkin {
      z-index: 1;
    }

    .pumpkin-stage.is-broken > .pumpkin {
      visibility: hidden;
    }

    .carve-piece {
      opacity: 0;
    }

    body[data-carve="1"] [data-step="1"],
    body[data-carve="2"] [data-step="1"],
    body[data-carve="2"] [data-step="2"],
    body[data-carve="3"] .carve-piece {
      opacity: 1;
    }

    .crack,
    .crack-glow {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .crack {
      stroke: #2a0b02;
      stroke-width: 5;
    }

    .crack-glow {
      stroke: #ffd36e;
      stroke-width: 1.8;
    }

    .shard {
      position: absolute;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
      animation:
        shatter 0.9s cubic-bezier(0.12, 0.75, 0.2, 1) forwards,
        shard-fade 2s linear forwards;
    }

    .shard .pumpkin {
      max-width: none;
    }

    @keyframes flash {
      50% {
        opacity: 0;
      }
    }

    @keyframes fade-out {
      to {
        opacity: 0;
      }
    }

    @keyframes shatter {
      to {
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
      }
    }

    @keyframes shard-fade {
      0%, 50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    body.is-revealed .pumpkin-stage {
      animation: fade-out 0.8s linear forwards;
    }

    .flyer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }

    body.is-flyer .flyer {
      display: flex;
    }

    .flyer-slot {
      display: block;
      width: auto;
      height: auto;
      max-width: min(86vw, 520px);
      max-height: 92vh;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 30;
      overflow: hidden;
      pointer-events: none;
    }

    .vignette > div {
      position: absolute;
      inset: 0;
      will-change: opacity, transform;
    }

    .vignette-shade {
      background: radial-gradient(ellipse closest-side, rgba(0, 0, 0, 0) 55%, rgba(26, 4, 40, 0.7) 85%, rgba(8, 0, 14, 0.96) 100%);
    }

    .vignette-glow {
      background: radial-gradient(ellipse closest-side, rgba(255, 110, 0, 0) 58%, rgba(255, 110, 0, 0.45) 82%, rgba(190, 20, 0, 0.9) 100%);
    }

    .vignette-flash {
      opacity: 0;
      background: radial-gradient(ellipse closest-side, rgba(255, 190, 90, 0.15) 0%, rgba(255, 120, 20, 0.55) 65%, rgba(255, 70, 0, 0.95) 100%);
    }
  </style>
</head>
<body>
  <div class="scene">
    <p class="prompt">Click to carve the pumpkin</p>
    <div class="pumpkin-stage">
      <svg class="person-layer" viewBox="0 0 400 460" aria-hidden="true">
        <defs>
          <clipPath id="person-clip" clipPathUnits="userSpaceOnUse">

      </svg>
      <svg class="pumpkin" viewBox="0 0 400 460" role="img" aria-label="Pumpkin">
        <defs>

          <clipPath id="pumpkin-shape">

            <!-- His left eye, his right eye, then the mouth, cut to the feature. -->

            <ellipse class="carve-piece" data-step="2" cx="112" cy="218" rx="36" ry="18" fill="#000" transform="rotate(-20 112 218)"/>
            <path

        </g>

        <!-- Cracks open outward from the carved holes as the drop nears. data-at is when each starts. -->
        <g class="cracks" clip-path="url(#pumpkin-shape)" mask="url(#pumpkin-holes)">
          <path class="crack" data-at="0" d="M196 118 L188 140 L198 158 L182 182 L190 200 L174 224"/>
          <path class="crack" data-at="0.08" d="M290 197 L298 218 L286 236 L296 258 L288 280"/>
          <path class="crack" data-at="0.14" d="M152 332 L130 338 L122 358 L98 366 L84 384"/>
          <path class="crack" data-at="0.2" d="M320 176 L338 168 L344 186 L362 192 L368 208"/>
          <path class="crack" data-at="0.26" d="M204 206 L216 228 L204 248 L218 270 L210 292"/>
          <path class="crack" data-at="0.32" d="M120 203 L128 180 L118 162 L132 138 L124 118"/>
          <path class="crack" data-at="0.38" d="M232 341 L226 362 L240 378 L230 402 L236 414"/>
          <path class="crack" data-at="0.44" d="M80 230 L62 238 L68 258 L46 272 L40 292"/>
          <path class="crack" data-at="0.5" d="M316 310 L334 322 L328 344 L348 358 L346 378"/>
          <path class="crack" data-at="0.56" d="M214 120 L232 132 L242 120 L262 140 L272 162"/>
          <path class="crack" data-at="0.62" d="M198 158 L216 166 L224 184"/>
          <path class="crack" data-at="0.66" d="M298 218 L318 226 L326 246"/>
          <path class="crack" data-at="0.7" d="M68 258 L86 272 L82 292"/>
          <path class="crack" data-at="0.74" d="M226 362 L206 372 L198 392"/>
          <path class="crack" data-at="0.78" d="M334 322 L354 314"/>
          <path class="crack" data-at="0.82" d="M128 180 L104 172 L92 186"/>
        </g>
        <g class="crack-glows" clip-path="url(#pumpkin-shape)" mask="url(#pumpkin-holes)"></g>

        <path
          d="M186 112 C180 68 210 34 252 24 C228 46 210 74 208 114 C200 124 190 122 186 112 Z"
          fill="url(#stem)"
        />
        <path
          d="M214 78 C236 70 258 86 268 108"
          fill="none"
          stroke="#3f7a2c"
          stroke-width="7"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </div>
  <div class="flyer">
    <img class="flyer-slot" src="./IMG_0992.JPG" alt="BΘΠ Halloween, House 22, Saturday Oct 31, 10PM">
  </div>
  <div class="vignette" aria-hidden="true">
    <div class="vignette-shade"></div>
    <div class="vignette-glow"></div>
    <div class="vignette-flash"></div>
  </div>

  <script>
    const KNIFE_URL = encodeURI("./Knife Sound Effect ( HD ) No Copyright.mp3");
    const SONG_URL = encodeURI("./Odd Mob, OMNOM, HYPERBEAM - Take You There (Extended Mix).mp3");
    const KNIFE_CUT_SECONDS = 0.4;
    const SONG_START_SECONDS = 80;
    // First kick of the drop, measured from the track. The beat grid is anchored here.
    const DROP_SECONDS = 90.23;
    const BEAT_SECONDS = 60 / 128;
    // Downbeat six bars after the drop, once the zoom has settled.
    const FLYER_AT_SECONDS = DROP_SECONDS + 24 * BEAT_SECONDS;
    const SONG_WAIT_MS = 5000;
    const CRACK_GROW = 0.14;
    const HEARTBEAT_SECONDS = 1.3;
    const HEARTBEAT_RACE = 0.12;
    const CARVE_LEVEL = 0.12;
    const BREAK_LEVEL = 0.3;
    const DROP_LEVEL = 0.6;
    const FLYER_LEVEL = 0.35;
    const SONG_START_VOLUME = 0.02;
    const SONG_FADE_SECONDS = 10;
    const SHARD_FADE_MS = 2000;
    const OUTLINE_OPEN_MS = 600;
    const ZOOM_OUT_MS = 7000;
    const CARVE_STEPS = 3;
    const SHARD_COLUMNS = 4;
    const SHARD_ROWS = 5;

    let audioContext = null;
    let songGain = null;
    let knifeBytes = null;
    let knifeBuffer = null;
    let songBytes = null;
    let songBuffer = null;
    let songAudio = null;
    let songSourceStartedAt = null;
    let songStarted = false;
    let songDecodeFailed = false;
    let decodingSong = false;
    let cueTimer = 0;
    let revealReady = false;
    let flyerShown = false;
    let carveStep = 0;
    let breaking = false;
    let breakStartedAt = 0;
    let broken = false;
    let songClockTime = 0;
    let elementTime = 0;
    let elementTimeAt = 0;

    /**
     * Drops the leading ID3 tag. This file hides the audio behind about 3MB of
     * tag data, which makes Safari refuse to decode it and report that it cannot seek.
     */
    function stripId3(buffer) {
      const bytes = new Uint8Array(buffer);
      const isId3 = bytes.length >= 10 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33;
      if (!isId3) {
        return buffer;
      }

      const size = ((bytes[6] & 0x7f) << 21)
        | ((bytes[7] & 0x7f) << 14)
        | ((bytes[8] & 0x7f) << 7)
        | (bytes[9] & 0x7f);
      const footer = (bytes[5] & 0x10) ? 10 : 0;
      const start = Math.min(buffer.byteLength, 10 + size + footer);
      return buffer.slice(start);
    }

    /** Decodes a copy of the bytes. Safari consumes the buffer it is given. */
    function decodeAudio(bytes) {
      const copy = bytes.slice(0);
      return new Promise((resolve, reject) => {
        let settled = false;
        const finish = (buffer) => {
          if (settled || !buffer) {
            return;
          }
          settled = true;
          resolve(buffer);
        };
        const fail = (error) => {
          if (settled) {
            return;
          }
          settled = true;
          reject(error || new Error("decode"));
        };

        try {
          const result = audioContext.decodeAudioData(copy);
          if (result && typeof result.then === "function") {
            result.then(finish).catch(fail);
            return;
          }
        } catch (error) {
          // Older Safari requires the callback form and consumes the first copy.
        }

        audioContext.decodeAudioData(bytes.slice(0), finish, fail);
      });
    }

    /** Black screen with the party banner. */
    function showFlyer() {
      flyerShown = true;
      document.body.classList.add("is-flyer");
    }

    /** Starts the song element at 1:20 and rises linearly to full volume at the drop. */
    function startSongElement() {
      if (songStarted || !songAudio || !songAudio.src) {
        return;
      }

      songStarted = true;
      let began = false;
      const begin = () => {
        if (began) {
          return;
        }
        began = true;
        songAudio.volume = SONG_START_VOLUME;
        const pending = songAudio.play();
        if (pending && typeof pending.catch === "function") {
          pending.catch(() => {
            songStarted = false;
            began = false;
          });
        }
        const started = performance.now();
        const fade = () => {
          const elapsed = (performance.now() - started) / 1000;
          songAudio.volume = Math.min(1, SONG_START_VOLUME + (1 - SONG_START_VOLUME) * (elapsed / SONG_FADE_SECONDS));
          if (elapsed < SONG_FADE_SECONDS) {
            requestAnimationFrame(fade);
          }
        };
        requestAnimationFrame(fade);
      };
      const seek = () => {
        if (Math.abs(songAudio.currentTime - SONG_START_SECONDS) < 0.5) {
          begin();
          return;
        }
        const backup = window.setTimeout(begin, 800);
        songAudio.addEventListener("seeked", () => {
          window.clearTimeout(backup);
          begin();
        }, { once: true });
        songAudio.currentTime = SONG_START_SECONDS;
      };

      if (songAudio.readyState >= 1) {
        seek();
      } else {
        songAudio.addEventListener("loadedmetadata", seek, { once: true });
      }
    }

    /** Plays the decoded song through the audio context at 1:20. */
    function startSongBuffer() {
      if (songStarted || !songBuffer || !audioContext) {
        return;
      }

      songStarted = true;
      const start = () => {
        const source = audioContext.createBufferSource();
        source.buffer = songBuffer;
        source.connect(songGain);
        const now = audioContext.currentTime;
        songGain.gain.cancelScheduledValues(now);
        songGain.gain.setValueAtTime(SONG_START_VOLUME, now);
        songGain.gain.linearRampToValueAtTime(1, now + SONG_FADE_SECONDS);
        source.start(now, SONG_START_SECONDS);
        songSourceStartedAt = now;
      };
      const resumed = audioContext.resume();
      if (resumed && typeof resumed.then === "function") {
        resumed.then(start).catch(start);
      } else {
        start();
      }
    }

    /** Decodes audio that has already been fetched, once Safari has unlocked the context. */
    function decodeLoadedAudio() {
      if (!audioContext || audioContext.state === "suspended") {
        return;
      }

      if (knifeBytes && !knifeBuffer) {
        const bytes = knifeBytes;
        knifeBytes = null;
        decodeAudio(bytes).then((buffer) => {
          knifeBuffer = buffer;
        }).catch(() => {});
      }

      if (!songBytes || songBuffer || decodingSong) {
        return;
      }

      decodingSong = true;
      decodeAudio(songBytes).then((buffer) => {
        songBuffer = buffer;
        cueMusic();
      }).catch(() => {
        songDecodeFailed = true;
        decodingSong = false;
        cueMusic();
      });
    }

    /**
     * Creates the audio context from the click. Safari stays silent if the
     * context is created or resumed outside a user gesture.
     */
    function ensureContext() {
      if (!audioContext) {
        const Context = window.AudioContext || window.webkitAudioContext;
        audioContext = new Context();
        songGain = audioContext.createGain();
        songGain.connect(audioContext.destination);
        const silent = audioContext.createBuffer(1, 1, 22050);
        const blip = audioContext.createBufferSource();
        blip.buffer = silent;
        blip.connect(audioContext.destination);
        blip.start(0);
      }

      const resumed = audioContext.resume();
      if (resumed && typeof resumed.then === "function") {
        resumed.then(decodeLoadedAudio);
      }
      decodeLoadedAudio();
    }

    /** Unlocks the audio context on a click without starting the song. */
    function unlockAudio() {
      ensureContext();
    }

    fetch(KNIFE_URL)
      .then((response) => response.arrayBuffer())
      .then((audioData) => {
        knifeBytes = audioData;
        decodeLoadedAudio();
      })
      .catch(() => {});

    fetch(SONG_URL)
      .then((response) => {
        if (!response.ok) {
          throw new Error("song");
        }
        return response.arrayBuffer();
      })
      .then((audioData) => {
        songBytes = stripId3(audioData);
        songAudio = songAudio || new Audio();
        songAudio.preload = "auto";
        if (!songStarted) {
          songAudio.src = URL.createObjectURL(new Blob([songBytes], { type: "audio/mpeg" }));
        }
        decodeLoadedAudio();
        cueMusic();
      })
      .catch(() => {
        songDecodeFailed = true;
        songAudio = songAudio || new Audio(SONG_URL);
        songAudio.preload = "auto";
        cueMusic();
      });

    /** Starts the song at 1:20 once the pumpkin starts breaking. */
    function cueMusic() {
      if (songStarted || !revealReady) {
        return;
      }

      if (songBuffer && audioContext) {
        window.clearTimeout(cueTimer);
        cueTimer = 0;
        startSongBuffer();
        return;
      }

      if (songDecodeFailed) {
        window.clearTimeout(cueTimer);
        cueTimer = 0;
        startSongElement();
        return;
      }

      if (!cueTimer) {
        cueTimer = window.setTimeout(() => {
          cueTimer = 0;
          if (songStarted || !revealReady) {
            return;
          }
          if (songBuffer && audioContext) {
            startSongBuffer();
          } else {
            startSongElement();
          }
        }, 2000);
      }
    }

    /** Eases the zoom so the face pulls back into the full picture. */
    function easeInOut(progress) {
      return progress < 0.5
        ? 2 * progress * progress
        : 1 - ((-2 * progress + 2) ** 2) / 2;
    }

    /** Fades the pumpkin outline into the rectangular photo, then zooms. */
    function openPumpkinOutline() {
      const layer = document.querySelector(".person-layer");
      const image = layer.querySelector("image");
      const box = image.cloneNode(true);
      box.removeAttribute("clip-path");
      box.setAttribute("opacity", "0");
      image.after(box);

      const started = performance.now();
      function frame(now) {
        const progress = Math.min((now - started) / OUTLINE_OPEN_MS, 1);
        box.setAttribute("opacity", String(easeInOut(progress)));
        if (progress < 1) {
          requestAnimationFrame(frame);
          return;
        }

        box.remove();
        image.removeAttribute("clip-path");
        zoomOutPerson();
        document.body.classList.add("is-revealed");
      }
      requestAnimationFrame(frame);
    }

    /** Zooms the same photo out from the face to the full cutout. */
    function zoomOutPerson() {
      const layer = document.querySelector(".person-layer");
      const image = layer.querySelector("image");
      const stage = document.querySelector(".pumpkin-stage");
      const stageRect = stage.getBoundingClientRect();
      image.removeAttribute("clip-path");
      layer.style.clipPath = "none";
      layer.setAttribute("preserveAspectRatio", "none");

      const fromBox = { x: 0, y: 0, w: 400, h: 460 };
      const fromFrame = {
        left: stageRect.left,
        top: stageRect.top,
        width: stageRect.width,
        height: stageRect.height
      };
      const imageX = Number(image.getAttribute("x"));
      const imageY = Number(image.getAttribute("y"));
      const imageW = Number(image.getAttribute("width"));
      const imageH = Number(image.getAttribute("height"));
      const viewAspect = window.innerWidth / window.innerHeight;
      let viewW = imageW / 0.9;
      let viewH = viewW / viewAspect;
      if (imageH > viewH * 0.92) {
        viewH = imageH / 0.92;
        viewW = viewH * viewAspect;
      }
      const toBox = {
        x: imageX - (viewW - imageW) / 2,
        y: imageY - (viewH - imageH) / 2,
        w: viewW,
        h: viewH
      };
      const toFrame = {
        left: 0,
        top: 0,
        width: window.innerWidth,
        height: window.innerHeight
      };

      document.body.appendChild(layer);
      layer.style.position = "fixed";
      layer.style.margin = "0";
      layer.style.right = "auto";
      layer.style.bottom = "auto";
      layer.style.zIndex = "6";

      const started = performance.now();
      function frame(now) {
        const progress = Math.min((now - started) / ZOOM_OUT_MS, 1);
        const eased = easeInOut(progress);
        const mix = (start, end) => start + (end - start) * eased;
        layer.style.left = `${mix(fromFrame.left, toFrame.left)}px`;
        layer.style.top = `${mix(fromFrame.top, toFrame.top)}px`;
        layer.style.width = `${mix(fromFrame.width, toFrame.width)}px`;
        layer.style.height = `${mix(fromFrame.height, toFrame.height)}px`;
        layer.setAttribute("viewBox", [
          mix(fromBox.x, toBox.x),
          mix(fromBox.y, toBox.y),
          mix(fromBox.w, toBox.w),
          mix(fromBox.h, toBox.h)
        ].join(" "));
        if (progress < 1) {
          requestAnimationFrame(frame);
        }
      }
      requestAnimationFrame(frame);
    }

    /** Opens the outline and zooms once the shards have faded. */
    function revealPerson() {
      window.setTimeout(openPumpkinOutline, SHARD_FADE_MS);
    }

    /** Plays the first 0.4 seconds of the knife cut. */
    function playKnifeCut() {
      if (!knifeBuffer || !audioContext) {
        const cut = new Audio(KNIFE_URL);
        const pending = cut.play();
        if (pending && typeof pending.catch === "function") {
          pending.catch(() => {});
        }
        window.setTimeout(() => cut.pause(), KNIFE_CUT_SECONDS * 1000);
        return;
      }

      audioContext.resume();
      const source = audioContext.createBufferSource();
      source.buffer = knifeBuffer;
      source.connect(audioContext.destination);
      source.start(0, 0, KNIFE_CUT_SECONDS);
    }

    /**
     * Copies the pumpkin with its own gradient and mask.
     * Pieces that borrow the hidden pumpkin's paint stay blank in Safari.
     */
    function clonePumpkinPiece(svg, index) {
      const clone = svg.cloneNode(true);
      const suffix = `-piece-${index}`;
      clone.querySelectorAll("[id]").forEach((node) => {
        node.setAttribute("id", `${node.getAttribute("id")}${suffix}`);
      });
      clone.querySelectorAll("*").forEach((node) => {
        ["fill", "stroke", "mask", "clip-path"].forEach((name) => {
          const value = node.getAttribute(name);
          if (!value || value.indexOf("url(#") === -1) {
            return;
          }
          node.setAttribute(name, value.replace(/url\(#([^)]+)\)/g, (_, id) => `url(#${id}${suffix})`));
        });
      });
      return clone;
    }

    /** Cuts the cracked pumpkin into pieces on the drop. */
    function shatterPumpkin() {
      if (broken) {
        return;
      }

      broken = true;
      const stage = document.querySelector(".pumpkin-stage");
      const svg = stage.querySelector(".pumpkin");
      stage.style.transform = "";
      const reach = stage.getBoundingClientRect().width;
      stage.classList.add("is-broken");
      if (audioContext) {
        audioContext.resume();
      }
      let piece = 0;
      for (let row = 0; row < SHARD_ROWS; row += 1) {
        for (let column = 0; column < SHARD_COLUMNS; column += 1) {
          const shard = document.createElement("div");
          shard.className = "shard";
          shard.style.left = `${(column / SHARD_COLUMNS) * 100}%`;
          shard.style.top = `${(row / SHARD_ROWS) * 100}%`;
          shard.style.width = `${100 / SHARD_COLUMNS}%`;
          shard.style.height = `${100 / SHARD_ROWS}%`;

          const clone = clonePumpkinPiece(svg, piece);
          piece += 1;
          clone.style.position = "absolute";
          clone.style.width = `${SHARD_COLUMNS * 100}%`;
          clone.style.height = `${SHARD_ROWS * 100}%`;
          clone.style.left = `${-column * 100}%`;
          clone.style.top = `${-row * 100}%`;
          shard.appendChild(clone);

          const centerX = (column + 0.5) / SHARD_COLUMNS - 0.5;
          const centerY = (row + 0.5) / SHARD_ROWS - 0.5;
          let dx = centerX * reach * 1.85;
          let dy = centerY * reach * 1.55;
          if (Math.hypot(centerX, centerY) < 0.18) {
            const angle = Math.random() * Math.PI * 2;
            const distance = reach * (0.42 + Math.random() * 0.28);
            dx = Math.cos(angle) * distance;
            dy = Math.sin(angle) * distance;
          }

          shard.style.setProperty("--dx", `${(dx + (Math.random() - 0.5) * reach * 0.22).toFixed(1)}px`);
          shard.style.setProperty("--dy", `${(dy + (Math.random() - 0.5) * reach * 0.18).toFixed(1)}px`);
          shard.style.setProperty("--rot", `${Math.round((Math.random() - 0.5) * 520)}deg`);
          stage.appendChild(shard);
        }
      }

      revealPerson();
    }

    /** Starts the song and lets the pumpkin crack until the drop breaks it. */
    function startBreaking() {
      breaking = true;
      breakStartedAt = performance.now();
      document.body.classList.add("is-breaking");
      revealReady = true;
      cueMusic();
    }

    /** Advances the face, then starts breaking the pumpkin on the click after the mouth. */
    function carve() {
      if (breaking) {
        return;
      }

      if (carveStep >= CARVE_STEPS) {
        playKnifeCut();
        startBreaking();
        return;
      }

      carveStep += 1;
      document.body.dataset.carve = String(carveStep);
      document.body.classList.add("is-carving");
      playKnifeCut();
    }

    /** Where the song is now, or null until it is audibly playing. */
    function songPosition(now) {
      if (songSourceStartedAt !== null) {
        const latency = audioContext.outputLatency || audioContext.baseLatency || 0;
        return SONG_START_SECONDS + audioContext.currentTime - songSourceStartedAt - latency;
      }

      if (!songStarted || !songAudio || songAudio.paused || songAudio.currentTime < SONG_START_SECONDS - 1) {
        return null;
      }

      // The element's clock ticks coarsely in some browsers, so fill the gaps.
      if (songAudio.currentTime !== elementTime) {
        elementTime = songAudio.currentTime;
        elementTimeAt = now;
      }
      return elementTime + Math.min(now - elementTimeAt, 250) / 1000;
    }

    /**
     * Song time that drives the break. If the song never starts, a stand-in
     * clock runs from 1:20 so the pumpkin still breaks. It never runs backwards.
     */
    function songClock(now) {
      let position = songPosition(now);
      if (position === null && now - breakStartedAt > SONG_WAIT_MS) {
        position = SONG_START_SECONDS + (now - breakStartedAt - SONG_WAIT_MS) / 1000;
      }
      if (position === null) {
        return null;
      }

      songClockTime = Math.max(songClockTime, position);
      return songClockTime;
    }

    /** Two thumps per heartbeat, each falling off quickly. */
    function heartbeat(phase) {
      const seconds = (phase % 1) * HEARTBEAT_SECONDS;
      const lub = Math.exp(-seconds / 0.1);
      const dub = seconds > 0.26 ? 0.65 * Math.exp(-(seconds - 0.26) / 0.1) : 0;
      return Math.max(lub, dub);
    }

    const vignetteShade = document.querySelector(".vignette-shade");
    const vignetteGlow = document.querySelector(".vignette-glow");
    const vignetteFlash = document.querySelector(".vignette-flash");
    const pumpkinStage = document.querySelector(".pumpkin-stage");
    const crackGlows = document.querySelector(".pumpkin .crack-glows");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /** Each crack is drawn twice: a dark split with a thin glow inside it. */
    const cracks = Array.from(document.querySelectorAll(".pumpkin .crack")).map((crack) => {
      const glow = crack.cloneNode();
      glow.setAttribute("class", "crack-glow");
      crackGlows.appendChild(glow);
      const length = crack.getTotalLength();
      const paths = [crack, glow];
      paths.forEach((path) => {
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });
      return { start: Number(crack.getAttribute("data-at")), length, paths };
    });
    let crackedTo = 0;

    /** Darker edges always; the orange glow swells with level and kicks with each pulse. */
    function paintVignette(level, pulse, flash) {
      vignetteShade.style.opacity = (0.35 + 0.55 * level).toFixed(3);
      vignetteShade.style.transform = `scale(${(1.25 - 0.2 * level - 0.05 * pulse * level).toFixed(3)})`;
      vignetteGlow.style.opacity = ((0.08 + 0.92 * level) * (0.3 + 0.7 * pulse)).toFixed(3);
      vignetteGlow.style.transform = `scale(${(1.4 - 0.28 * level - 0.12 * pulse * level).toFixed(3)})`;
      vignetteFlash.style.opacity = flash.toFixed(3);
    }

    /** Opens the cracks a step on each beat, so the pumpkin splits in time. */
    function crackPumpkin(position) {
      const beats = (position - DROP_SECONDS) / BEAT_SECONDS;
      const landed = Math.floor(beats) + Math.min(1, (beats - Math.floor(beats)) / 0.2);
      const progress = Math.min(1, Math.max(0, (landed * BEAT_SECONDS + DROP_SECONDS - SONG_START_SECONDS) / (DROP_SECONDS - SONG_START_SECONDS)));
      if (progress === crackedTo) {
        return;
      }

      crackedTo = progress;
      cracks.forEach(({ start, length, paths }) => {
        const grown = Math.min(1, Math.max(0, (progress - start) / CRACK_GROW));
        paths.forEach((path) => {
          path.style.strokeDashoffset = String(length * (1 - grown));
        });
      });
    }

    /** Trembles harder as the drop nears and jolts on each beat. */
    function shakePumpkin(progress, pulse, seconds) {
      if (reduceMotion) {
        return;
      }

      const tremble = 2.5 * progress ** 1.5;
      const kick = 7 * progress ** 2 * pulse;
      const x = Math.sin(seconds * 71) * tremble + Math.sin(seconds * 23) * kick;
      const y = Math.cos(seconds * 59) * tremble * 0.6 + Math.cos(seconds * 31) * kick * 0.5;
      const rotate = Math.sin(seconds * 37) * (0.6 + 1.4 * pulse) * progress ** 2;
      const scale = 1 + 0.025 * progress + 0.03 * progress * pulse;
      pumpkinStage.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) rotate(${rotate.toFixed(2)}deg) scale(${scale.toFixed(4)})`;
    }

    let heartPhase = 0;
    let lastFrame = performance.now();

    /**
     * A heartbeat that races as the face is carved, then pulses locked to the
     * song's beat, building to the drop, where the pumpkin breaks.
     */
    function tick(now) {
      requestAnimationFrame(tick);
      const position = breaking ? songClock(now) : null;
      let level;
      let pulse;
      let flash = 0;

      if (position === null) {
        const period = HEARTBEAT_SECONDS * (1 - HEARTBEAT_RACE * carveStep);
        heartPhase += (now - lastFrame) / 1000 / period;
        level = breaking ? BREAK_LEVEL : CARVE_LEVEL + (BREAK_LEVEL - CARVE_LEVEL) * (carveStep / CARVE_STEPS);
        pulse = heartbeat(heartPhase);
      } else {
        const beats = (position - DROP_SECONDS) / BEAT_SECONDS;
        const sinceBeat = (beats - Math.floor(beats)) * BEAT_SECONDS;

        if (position < DROP_SECONDS) {
          const progress = Math.max(0, (position - SONG_START_SECONDS) / (DROP_SECONDS - SONG_START_SECONDS));
          level = BREAK_LEVEL + (1 - BREAK_LEVEL) * progress ** 1.6;
          // Each pulse lingers longer, so the last bars glow almost solid.
          pulse = Math.exp(-sinceBeat / (0.12 + 0.2 * progress ** 2));
          crackPumpkin(position);
          shakePumpkin(progress, pulse, now / 1000);
        } else {
          shatterPumpkin();
          const sinceDrop = position - DROP_SECONDS;
          flash = Math.exp(-sinceDrop / 0.3);
          pulse = Math.exp(-sinceBeat / 0.16);
          level = DROP_LEVEL + (1 - DROP_LEVEL) * Math.exp(-sinceDrop / 2);
          if (position >= FLYER_AT_SECONDS) {
            level = FLYER_LEVEL;
            if (!flyerShown) {
              showFlyer();
            }
          }
        }
      }

      lastFrame = now;
      paintVignette(level, pulse, flash);
    }
    requestAnimationFrame(tick);

    document.addEventListener("pointerdown", () => {
      unlockAudio();
      carve();
    });
    document.addEventListener("touchend", unlockAudio);
  </script>
</body>
</html>
