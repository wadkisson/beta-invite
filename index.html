<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title></title>
  <style>
    @font-face {
      font-family: "Knewave";
      src: url("./fonts/Knewave.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Oswald";
      src: url("./fonts/Oswald.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .yuma {
      position: fixed;
      inset: -100px;
      z-index: 0;
      width: calc(100% + 200px);
      height: calc(100% + 200px);
      object-fit: cover;
      object-position: center;
    }

    body.is-yuma .yuma {
      animation: impact 0.55s linear both;
    }

    .poster-copy {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .wordmark {
      position: absolute;
      left: 50%;
      top: 4%;
      width: min(94vw, 1280px);
      overflow: visible;
      opacity: 0;
      translate: -50% -21%;
    }

    .wordmark text {
      font-family: "Knewave", cursive;
      font-size: 78px;
      fill: #f3ead7;
      letter-spacing: 0.08em;
    }

    .details {
      position: absolute;
      left: 50%;
      bottom: 2.2%;
      margin: 0;
      color: rgba(246, 240, 228, 0.92);
      font-family: "Oswald", sans-serif;
      font-weight: 500;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      line-height: 1.35;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transform: translateX(-50%) scale(2, 1.5);
    }

    .details p {
      margin: 0;
    }

    .details .place {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7em;
      font-size: clamp(11px, 1.35vw, 18px);
    }

    .details .place::before,
    .details .place::after {
      content: "";
      width: 1.5em;
      height: 1px;
      background: currentColor;
    }

    .details .when {
      margin-top: 0.28em;
      font-size: clamp(8px, 0.95vw, 12px);
      letter-spacing: 0.16em;
    }

    .details .time {
      font-size: clamp(8px, 0.85vw, 11px);
    }

    .flashbang {
      position: fixed;
      inset: 0;
      z-index: 6;
      background: #fff;
      pointer-events: none;
      opacity: 0;
    }

    body.is-flyer .flashbang {
      animation: flashbang 0.2s linear both;
    }

    body.is-flyer .wordmark {
      animation: letters-in 0.5s cubic-bezier(0.16, 0.8, 0.24, 1) both;
    }

    body.is-flyer .details {
      animation: details-pop 0.42s cubic-bezier(0.2, 1.35, 0.36, 1) both;
    }

    @keyframes flashbang {
      0%, 8% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes letters-in {
      0% { opacity: 0; transform: scale(1.42); }
      28% { opacity: 1; transform: scale(1.16); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes details-pop {
      from { opacity: 0; transform: translateX(-50%) scale(1.64, 1.23); }
      to { opacity: 1; transform: translateX(-50%) scale(2, 1.5); }
    }

    .strobe {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background: #fff;
      transition: opacity 0.18s linear;
    }

    .sweep {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 4;
      width: 46vw;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.2) 22%, #fff 46%, #fff 54%, rgba(255, 255, 255, 0.2) 78%, transparent 100%);
      mix-blend-mode: screen;
    }

    .sweep.is-across {
      animation: sweep-across 0.32s linear both;
    }

    .sweep.is-from-right {
      animation: sweep-from-right 0.32s linear both;
    }

    @keyframes sweep-across {
      0% { opacity: 1; transform: translate3d(-54vw, 0, 0); }
      82% { opacity: 1; transform: translate3d(78vw, 0, 0); }
      100% { opacity: 0; transform: translate3d(108vw, 0, 0); }
    }

    @keyframes sweep-from-right {
      0% { opacity: 1; transform: translate3d(108vw, 0, 0); }
      82% { opacity: 1; transform: translate3d(-24vw, 0, 0); }
      100% { opacity: 0; transform: translate3d(-54vw, 0, 0); }
    }

    /* Oversized so the shake never flashes the page edge. */
    .world {
      position: fixed;
      inset: -48px;
      z-index: 1;
      background: #000;
      transition: opacity 0.06s linear;
    }

    body.is-yuma .world {
      opacity: 0;
      pointer-events: none;
    }

    .world.is-shaking {
      --amp: calc(8px + (var(--hit) - 1) * 5px);
      animation: shake 0.26s linear both;
    }

    @keyframes impact {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      6% { transform: translate3d(-58px, 22px, 0) rotate(-2.6deg); }
      14% { transform: translate3d(54px, -20px, 0) rotate(2.4deg); }
      24% { transform: translate3d(-44px, 16px, 0) rotate(-1.9deg); }
      36% { transform: translate3d(32px, -12px, 0) rotate(1.3deg); }
      50% { transform: translate3d(-18px, 7px, 0) rotate(-0.7deg); }
      66% { transform: translate3d(9px, -3px, 0) rotate(0.28deg); }
      82% { transform: translate3d(-3px, 1px, 0) rotate(0deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      8% { transform: translate3d(calc(var(--amp) * -1), calc(var(--amp) * 0.28), 0) rotate(-0.55deg); }
      18% { transform: translate3d(calc(var(--amp) * 0.92), calc(var(--amp) * -0.22), 0) rotate(0.5deg); }
      30% { transform: translate3d(calc(var(--amp) * -0.74), calc(var(--amp) * 0.26), 0) rotate(-0.4deg); }
      44% { transform: translate3d(calc(var(--amp) * 0.56), calc(var(--amp) * -0.14), 0) rotate(0.3deg); }
      58% { transform: translate3d(calc(var(--amp) * -0.36), calc(var(--amp) * 0.1), 0) rotate(-0.18deg); }
      74% { transform: translate3d(calc(var(--amp) * 0.16), calc(var(--amp) * -0.05), 0) rotate(0.08deg); }
      88% { transform: translate3d(calc(var(--amp) * -0.06), 0, 0) rotate(0deg); }
    }

    .hanger {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.2s linear, visibility 0s linear 0.2s;
    }

    .hanger.is-gone {
      opacity: 0;
      visibility: hidden;
    }

    /* Starts above the screen so the shake never unhooks it from the ceiling. */
    .string {
      position: absolute;
      left: 50%;
      top: -64px;
      width: 2px;
      height: 0;
      translate: -50% 0;
      border-radius: 1px;
      background: linear-gradient(#7a7a7a, #f4f4f4 45%, #bdbdbd);
    }

    .ball {
      --size: min(46vw, 30vh, 250px);
      position: absolute;
      left: 50%;
      top: -46%;
      width: var(--size);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      background: none;
      translate: -50% 0;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      outline: none;
    }

    .hanger.is-live .string,
    .hanger.is-live .ball {
      transition:
        height var(--drop, 1.56s) var(--ease, cubic-bezier(0.22, 1.16, 0.32, 1)),
        top var(--drop, 1.56s) var(--ease, cubic-bezier(0.22, 1.16, 0.32, 1));
    }

    .ball svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    @media (prefers-reduced-motion: reduce) {
      .hanger,
      .hanger.is-live .string,
      .hanger.is-live .ball {
        transition-duration: 0.01s;
      }

      .world.is-shaking,
      body.is-yuma .yuma {
        animation: none;
      }

      .world {
        transition-duration: 0.01s;
      }

      .strobe {
        transition: none;
      }

      .flashbang,
      .sweep,
      .wordmark,
      .details,
      body.is-flyer .flashbang,
      body.is-flyer .wordmark,
      body.is-flyer .details {
        animation: none;
      }

      body.is-flyer .wordmark {
        opacity: 1;
        transform: none;
      }

      body.is-flyer .details {
        opacity: 1;
        transform: translateX(-50%) scale(2, 1.5);
      }
    }
  </style>
</head>
<body>
  <img class="yuma" src="./yuma.png" alt="Yuma stage">
  <div class="poster-copy">
    <svg class="wordmark" viewBox="0 0 1400 360" role="img" aria-label="Betachella" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <path id="betachella-arc" d="M 20 320 Q 700 70 1380 320"/>
        <filter id="letter-glow" x="-20%" y="-80%" width="140%" height="260%" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="16" result="wide"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="tight"/>
          <feComponentTransfer in="wide" result="halo">
            <feFuncA type="linear" slope="1.15"/>
          </feComponentTransfer>
          <feMerge>
            <feMergeNode in="halo"/>
            <feMergeNode in="tight"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <text filter="url(#letter-glow)">
        <textPath href="#betachella-arc" xlink:href="#betachella-arc" startOffset="40" textLength="1310" lengthAdjust="spacing">BETACHELLA</textPath>
      </text>
    </svg>
    <div class="details">
      <p class="place">House 22</p>
      <p class="when">Saturday November 14<sup>th</sup></p>
      <p class="time">9:30 PM</p>
    </div>
  </div>
  <div class="strobe" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"></div>
  <div class="flashbang" aria-hidden="true"></div>
  <audio class="track" preload="auto"></audio>
  <div class="world">
    <div class="hanger">
      <div class="string" aria-hidden="true"></div>
    <button class="ball" type="button" aria-label="Disco ball">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <clipPath id="ball-clip">
            <circle cx="100" cy="108" r="84"/>
          </clipPath>
          <radialGradient id="ball-light" cx="32%" cy="28%" r="70%">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.88"/>
            <stop offset="16%" stop-color="#fff" stop-opacity="0.22"/>
            <stop offset="48%" stop-color="#000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.62"/>
          </radialGradient>
        </defs>
        <g id="facets" clip-path="url(#ball-clip)"></g>
        <circle cx="100" cy="108" r="84" fill="url(#ball-light)"/>
        <circle cx="100" cy="108" r="83.4" fill="none" stroke="#4e565e" stroke-width="1.1"/>
      </svg>
    </button>
    </div>
  </div>
  <script>
    const CLICKS = 3;
    const RESTS = ["8%", "27%", "46%", "65%"];
    const DROP_ANIM_MS = 1560;
    // Opening drop only. The clicked drops last exactly one beat and land on the shake.
    const LAND_MS = DROP_ANIM_MS * 0.75;
    const SHAKE_MS = 350;
    const START_VOLUME = 0;
    const SONG_START_SECONDS = 0;
    const FLYER_MS = 8000;
    const BPM = 72;
    const BEAT_S = 60 / BPM;
    // One empty beat, then drop, shake, drop, shake, drop, shake, then the photo.
    const REVEAL_BEAT = 7;

    const world = document.querySelector(".world");
    const hanger = document.querySelector(".hanger");
    const string = document.querySelector(".string");
    const ball = document.querySelector(".ball");
    const track = document.querySelector(".track");
    const SONG_FILE = "./Interplanetary%20Criminal,%20Kettama%20-%20Yosemite%20.mp3";
    track.src = SONG_FILE;
    const strobe = document.querySelector(".strobe");
    const sweep = document.querySelector(".sweep");
    const CAP = "calc(min(46vw, 30vh, 250px) * 0.145)";
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Volume reaches full as the photo hits, six beats after the click.
    const REVEAL_MS = (reduceMotion ? 0.04 : BEAT_S * REVEAL_BEAT) * 1000;

    let clicks = 0;
    let moveId = 0;
    let landedId = 0;
    let opened = false;
    let ready = false;
    let busy = false;
    let playing = false;
    let songStarted = false;
    let revealed = false;
    let lastBeat = -1;
    let firstFlashBeat = Infinity;
    let flyerSongTime = Infinity;
    let cueUrl = "";

    /** Paints the mirrored tiles, brighter toward the upper-left light. */
    function paintFacets() {
      const svgNS = "http://www.w3.org/2000/svg";
      const group = document.getElementById("facets");
      const cx = 100;
      const cy = 108;
      const radius = 84;
      const rows = 18;
      const gap = 0.55;
      const sparks = ["#f6c6dc", "#c6ecff", "#ffe3a6", "#ddd0ff"];

      for (let row = 0; row < rows; row += 1) {
        const y0 = cy - radius + (row * (radius * 2)) / rows;
        const y1 = y0 + (radius * 2) / rows;
        const midY = (y0 + y1) / 2;
        const half = Math.sqrt(Math.max(0, radius * radius - (midY - cy) ** 2));
        // Drawn past the rim so the circular clip, not the tile grid, is the edge.
        const reach = half + 2.4;
        const tile = (radius * 2) / rows;
        const cols = Math.max(1, Math.round((reach * 2) / tile));
        const tileW = (reach * 2) / cols;

        for (let col = 0; col < cols; col += 1) {
          const x = cx - reach + col * tileW;
          const across = cols === 1 ? 0.5 : col / (cols - 1);
          const down = row / (rows - 1);
          const light = 1 - Math.min(1, Math.hypot(across - 0.32, down - 0.22) / 1.05);
          const rect = document.createElementNS(svgNS, "rect");
          rect.setAttribute("x", (x + gap / 2).toFixed(2));
          rect.setAttribute("y", (y0 + gap / 2).toFixed(2));
          rect.setAttribute("width", Math.max(0.35, tileW - gap).toFixed(2));
          rect.setAttribute("height", Math.max(0.35, y1 - y0 - gap).toFixed(2));
          rect.setAttribute("fill", tileColor(row, col, light, sparks));
          rect.classList.add("facet");
          group.appendChild(rect);
        }
      }
    }

    /** Silver mirror, with an occasional colored facet. */
    function tileColor(row, col, light, sparks) {
      if ((row * 5 + col * 3) % 9 === 0) {
        return sparks[(row + col) % sparks.length];
      }

      const band = (row + col) % 4;
      const shade = Math.max(96, Math.min(255, Math.round(138 + light * 112 - band * 14)));
      const cool = band % 2 === 0 ? 8 : 0;
      return `rgb(${shade}, ${shade}, ${Math.min(255, shade + cool)})`;
    }

    /**
     * Moves the ball to a resting height.
     * The timeout covers browsers that skip transitionend for very short drops.
     */
    function fallTo(nextTop, done) {
      const token = ++moveId;
      busy = true;
      ball.style.top = nextTop;
      string.style.height = `calc(64px + ${nextTop} + ${CAP})`;

      const finish = (event) => {
        if (event && event.propertyName && event.propertyName !== "top") {
          return;
        }
        if (token !== moveId || landedId === token) {
          return;
        }
        landedId = token;
        ball.removeEventListener("transitionend", finish);
        if (typeof done === "function") {
          done();
        }
      };

      ball.addEventListener("transitionend", finish);
      const limit = reduceMotion ? 40 : (playing ? BEAT_S * 1000 : LAND_MS);
      window.setTimeout(() => finish(), limit);
    }

    /** Flashes a few mirrors at a time, on an uneven beat. */
    function glisten() {
      if (reduceMotion || revealed) {
        return;
      }

      const tiles = document.querySelectorAll("#facets .facet");
      const count = 1 + Math.floor(Math.random() * 3);
      for (let n = 0; n < count; n += 1) {
        const tile = tiles[Math.floor(Math.random() * tiles.length)];
        if (!tile || tile.dataset.lit === "1") {
          continue;
        }
        tile.dataset.lit = "1";
        const previous = tile.getAttribute("fill");
        tile.setAttribute("fill", Math.random() < 0.8 ? "#ffffff" : "#fff4c2");
        window.setTimeout(() => {
          tile.setAttribute("fill", previous);
          tile.dataset.lit = "0";
        }, 50 + Math.random() * 140);
      }

      window.setTimeout(glisten, 70 + Math.random() * 280);
    }

    /** The opening drop just arms the ball. The clicked sequence is scheduled on the beat. */
    function onLanded() {
      if (opened) {
        return;
      }
      opened = true;
      ready = true;
      busy = false;
    }

    /**
     * Runs fn on a song beat. Falls back to the clock if playback has not moved yet.
     * beat 0 is the click. The first drop is the next beat.
     */
    function atBeat(index, fn) {
      const armed = performance.now();
      const songAtArm = songSeconds();
      const check = () => {
        const songNow = songSeconds();
        const songMoved = songNow > songAtArm + 0.05;
        const elapsed = songMoved ? songNow - songAtArm : (performance.now() - armed) / 1000;
        const remaining = index * BEAT_S - elapsed;
        if (remaining <= 0.012) {
          fn();
          return;
        }
        window.setTimeout(check, Math.min(40, Math.max(12, (remaining - 0.012) * 1000)));
      };
      check();
    }

    /** Drop on a beat, shake on the next, three times, then the photo. */
    function playSequence() {
      hanger.style.setProperty("--drop", `${BEAT_S}s`);
      hanger.style.setProperty("--ease", "cubic-bezier(0.45, 0, 1, 1)");
      ball.getBoundingClientRect();

      const plan = ["drop", "shake", "drop", "shake", "drop", "shake", "yuma"];
      plan.forEach((action, step) => {
        atBeat(step + 1, () => runBeat(action));
      });
    }

    /** One beat of the clicked sequence. */
    function runBeat(action) {
      if (action === "drop") {
        if (clicks >= CLICKS) {
          return;
        }
        clicks += 1;
        fallTo(RESTS[clicks]);
        return;
      }

      if (action === "shake") {
        shake(() => {});
        return;
      }

      showYuma(REVEAL_BEAT);
    }

    /** Slams the photo in on its beat, one beat before the first flash. */
    function showYuma(revealIndex) {
      hanger.classList.add("is-gone");
      ball.setAttribute("aria-hidden", "true");
      ball.blur();
      revealed = true;
      document.body.classList.add("is-yuma");
      track.volume = 1;

      const now = songSeconds();
      const index = Number.isFinite(revealIndex) ? revealIndex : Math.round(now / BEAT_S);
      firstFlashBeat = index + 1;
      const rawFlyer = (now > 0.2 ? now : index * BEAT_S) + FLYER_MS / 1000;
      // One fewer normal flash before the left-to-right beam, so the beams, the bright pair, and the letters stay a beat earlier.
      flyerSongTime = Math.round(rawFlyer / BEAT_S) * BEAT_S - BEAT_S;
      flashStrobe();
      const untilFlyer = Math.max(0, (flyerSongTime - songSeconds()) * 1000);
      window.setTimeout(() => {
        document.body.classList.add("is-flyer");
      }, untilFlyer);
    }

    /** Playhead position in the original song, including a skipped opening. */
    function songSeconds() {
      const played = Number.isFinite(track.currentTime) ? track.currentTime : 0;
      if (String(track.src).startsWith("blob:")) {
        return SONG_START_SECONDS + played;
      }
      return played;
    }

    /** Flashes red or white on each beat, locked to the song. */
    function flashStrobe() {
      if (!document.body.classList.contains("is-yuma") || reduceMotion) {
        strobe.style.opacity = "0";
        return;
      }

      const beat = 60 / BPM;
      const time = songSeconds();
      const index = Math.floor(time / beat);
      const into = time - index * beat;

      if (index < firstFlashBeat) {
        const untilFlash = Math.max(16, (firstFlashBeat * beat - time) * 1000);
        window.setTimeout(flashStrobe, untilFlash);
        return;
      }

      const opening = index === firstFlashBeat && lastBeat !== firstFlashBeat;
      if ((into < 0.12 || (opening && into < 0.4)) && index !== lastBeat) {
        lastBeat = index;
        const lastBefore = Math.floor((flyerSongTime - 0.001) / beat);
        if (index === lastBefore - 3) {
          runSweep("across");
        } else if (index === lastBefore - 2) {
          runSweep("right");
        } else {
          const hard = index === lastBefore || index === lastBefore - 1;
          strobe.style.background = Math.random() < 0.5 ? "#ff2a2a" : "#fff";
          strobe.style.opacity = hard ? "0.48" : "0.24";
          window.setTimeout(() => {
            strobe.style.opacity = "0";
          }, beat * 280);
        }
      }

      const wait = Math.max(16, ((index + 1) * beat - time) * 1000);
      window.setTimeout(flashStrobe, wait);
    }

    /** First beam crosses left to right. The next beat crosses right to left. */
    function runSweep(kind) {
      sweep.classList.remove("is-across", "is-from-right");
      void sweep.offsetWidth;
      sweep.classList.add(kind === "right" ? "is-from-right" : "is-across");
    }

    /** Jolts the whole scene once, a little harder on each hit. */
    function shake(done) {
      if (reduceMotion) {
        done();
        return;
      }

      let finished = false;
      const stop = (event) => {
        if (event && event.animationName !== "shake") {
          return;
        }
        if (finished) {
          return;
        }
        finished = true;
        world.removeEventListener("animationend", stop);
        world.classList.remove("is-shaking");
        done();
      };

      world.style.setProperty("--hit", String(clicks));
      world.classList.add("is-shaking");
      world.addEventListener("animationend", stop);
      window.setTimeout(() => stop(), SHAKE_MS);
    }


    /** True when the browser can jump to the cue instead of playing the opening. */
    function canSeekToCue() {
      try {
        return track.seekable.length > 0
          && track.seekable.end(track.seekable.length - 1) >= SONG_START_SECONDS;
      } catch (error) {
        return false;
      }
    }

    /** Plays the trimmed file when a normal seek would snap back to the start. */
    function playFromCue() {
      if (!cueUrl || canSeekToCue()) {
        return false;
      }
      track.src = cueUrl;
      return true;
    }

    /** Starts Yosemite silent, eight seconds in, and rises in a straight line until the stage appears. */
    function startSong() {
      if (songStarted) {
        return;
      }

      songStarted = true;
      // Exact zero can leave the element silent after playback starts.
      track.volume = 0.001;
      if (!playFromCue()) {
        try {
          track.currentTime = SONG_START_SECONDS;
        } catch (error) {
          playFromCue();
        }
      }
      const pending = track.play();
      if (pending && typeof pending.catch === "function") {
        pending.catch((error) => {
          if (error && error.name === "NotAllowedError") {
            songStarted = false;
          }
        });
      }
      track.addEventListener("playing", () => {
        if (String(track.src).startsWith("blob:")) {
          return;
        }
        if (track.currentTime < 1) {
          try {
            track.currentTime = SONG_START_SECONDS;
          } catch (error) {
            playFromCue();
          }
        }
      }, { once: true });

      const started = performance.now();
      const fade = () => {
        if (!songStarted || revealed) {
          return;
        }
        const passed = Math.min(1, (performance.now() - started) / REVEAL_MS);
        track.volume = START_VOLUME + (1 - START_VOLUME) * passed;
        if (passed < 1) {
          window.setTimeout(fade, 50);
        }
      };
      window.setTimeout(fade, 50);
    }

    /** Finds the next mp3 frame so a trimmed copy still decodes. */
    function findFrame(bytes, guess) {
      const end = Math.min(bytes.length - 4, Math.max(0, guess) + 8192);
      for (let i = Math.max(0, guess); i < end; i += 1) {
        if (bytes[i] !== 0xff) {
          continue;
        }
        const header = bytes[i + 1];
        if ((header & 0xe0) !== 0xe0 || (header & 0x18) === 0x08 || (header & 0x06) === 0) {
          continue;
        }
        return i;
      }
      return Math.max(0, guess);
    }

    /**
     * Builds a copy that already starts at the cue.
     * Some previews cannot seek, so the play button would otherwise restart at the top.
     */
    function prepareCue() {
      if (cueUrl || canSeekToCue()) {
        return;
      }

      fetch(SONG_FILE)
        .then((response) => response.arrayBuffer())
        .then((buffer) => {
          if (canSeekToCue()) {
            return;
          }
          const bytes = new Uint8Array(buffer);
          const duration = Number.isFinite(track.duration) ? track.duration : 362.5;
          const guess = Math.floor(bytes.length * (SONG_START_SECONDS / duration));
          cueUrl = URL.createObjectURL(new Blob([bytes.subarray(findFrame(bytes, guess))], { type: "audio/mpeg" }));
          if (!songStarted || track.currentTime >= 1 || String(track.src).startsWith("blob:")) {
            return;
          }
          const volume = track.volume;
          track.src = cueUrl;
          track.volume = volume;
          const pending = track.play();
          if (pending && typeof pending.catch === "function") {
            pending.catch(() => {});
          }
        })
        .catch(() => {});
    }

    /** Starts the spaced drops. Later clicks do nothing. */
    function dropAgain() {
      if (!ready || busy || playing) {
        return;
      }

      playing = true;
      ball.style.cursor = "default";
      startSong();
      playSequence();
    }

    paintFacets();
    glisten();

    /** Drops the ball in. A timer covers browsers that pause animation frames in a hidden tab. */
    let entranceStarted = false;
    function startEntrance() {
      if (entranceStarted) {
        return;
      }
      entranceStarted = true;
      hanger.classList.add("is-live");
      ball.getBoundingClientRect();
      fallTo(RESTS[0], onLanded);
    }

    requestAnimationFrame(() => requestAnimationFrame(startEntrance));
    window.setTimeout(startEntrance, 60);

    ball.addEventListener("click", dropAgain);
    if (track.readyState >= 1) {
      prepareCue();
    } else {
      track.addEventListener("loadedmetadata", prepareCue);
    }
  </script>
</body>
</html>
