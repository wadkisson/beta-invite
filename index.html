<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* —— Confidential message —— */
    .intro {
      z-index: 10;
      background: #000;
      transition: opacity 0.35s ease, visibility 0.35s;
    }

    .intro.intro--hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .intro-box {
      width: min(92vw, 420px);
      padding: 1.75rem 1.5rem;
      background: #6e6e6e;
      border: 1px solid #555;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      opacity: 0;
      transform: scale(0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro.show-box .intro-box {
      animation: boxPop 0.35s ease forwards;
    }

    /* Instant hide (overrides boxPop fill) */
    .intro.show-box .intro-box.is-fading-out {
      animation: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none;
    }

    @keyframes boxPop {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .intro-text {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: clamp(13px, 3.2vw, 15px);
      line-height: 1.55;
      color: #111;
      min-height: 4.5em;
      white-space: pre-wrap;
      text-align: center;
      width: 100%;
    }

    .intro-text .cursor {
      display: inline-block;
      animation: blink 0.85s step-end infinite;
      margin-left: 1px;
    }

    .intro-text.done .cursor {
      display: none;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .open-btn {
      margin-top: 1.25rem;
      padding: 0.55rem 1.35rem;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #1a1a1a;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: background 0.2s, opacity 0.35s ease;
    }

    .open-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }

    .open-btn.ready:hover {
      background: #3a3a3a;
    }

    /* —— Matrix-style binary rain —— */
    .matrix-canvas {
      position: fixed;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .matrix-canvas.is-active {
      opacity: 1;
    }

    .intro.intro--with-matrix {
      background: transparent;
    }

    /* —— Green terminal text (centered stack: prompt + Yes) —— */
    .terminal-ui {
      position: fixed;
      inset: 0;
      z-index: 12;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      pointer-events: none;
    }

    .terminal-ui[hidden] {
      display: none !important;
    }

    .terminal-line {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: clamp(26px, 6.4vw, 30px);
      line-height: 1.45;
      color: #00ff66;
      text-shadow: 0 0 8px rgba(0, 255, 80, 0.25);
      max-width: calc(100vw - 32px);
      text-align: center;
    }

    .terminal-line .terminal-cursor {
      display: inline-block;
      animation: termBlink 0.9s step-end infinite;
      margin-left: 1px;
      color: #00ff66;
    }

    .terminal-line.typing-done .terminal-cursor {
      animation: termBlink 1s step-end infinite;
    }

    /* Last prompt: no cursor; text flashes in/out after typing. */
    .terminal-line.final-prompt .terminal-cursor {
      display: none;
    }

    .terminal-line.final-prompt {
      animation: terminalPromptFlash 1.1s ease-in-out infinite;
    }

    @keyframes terminalPromptFlash {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    @keyframes termBlink {
      50% { opacity: 0; }
    }

    .terminal-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .accept-mini {
      pointer-events: auto;
      border: 2px solid #00ff66;
      padding: 12px 28px;
      background: #000;
    }

    .accept-mini[hidden] {
      display: none !important;
    }

    .accept-mini button {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 28px;
      color: #00ff66;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .accept-mini button:hover {
      text-decoration: underline;
    }

    /* —— WWIII binary glyph (after Yes) —— */
    .wwiii-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      pointer-events: none;
    }

    .wwiii-screen[hidden] {
      display: none !important;
    }

    .wwiii-screen-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35em;
    }

    .wwiii-screen pre {
      margin: 0;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: clamp(10px, 2.1vw, 22px);
      line-height: 1;
      letter-spacing: 0.12em;
      color: #00ff66;
      text-shadow: 0 0 6px rgba(0, 255, 80, 0.35);
      white-space: pre;
      user-select: none;
    }

    .wwiii-date {
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: max(12px, calc(1.25 * clamp(10px, 2.1vw, 22px)));
      font-weight: 600;
      color: #00ff66;
      text-shadow: 0 0 4px rgba(0, 255, 80, 0.3);
      letter-spacing: 0.06em;
    }

  </style>
</head>
<body>
  <canvas id="matrixCanvas" class="matrix-canvas" aria-hidden="true"></canvas>

  <div id="testScreen" class="terminal-ui" hidden aria-hidden="true">
    <div class="terminal-stack">
      <div class="terminal-line" id="terminalBody" aria-live="polite">
        <span id="terminalOutput"></span><span class="terminal-cursor" id="terminalCursor">▍</span>
      </div>
      <div id="acceptBox" class="accept-mini" hidden>
        <button type="button" id="acceptYesBtn">Yes</button>
      </div>
    </div>
  </div>

  <div id="wwiiiScreen" class="wwiii-screen" hidden aria-hidden="true">
    <div class="wwiii-screen-inner">
      <pre id="wwiiiArt"></pre>
      <div class="wwiii-date">3/28</div>
    </div>
  </div>

  <div class="scene intro intro--hidden" id="intro" aria-hidden="true">
    <div class="intro-box" id="introBox">
      <p class="intro-text" id="typedLine" aria-live="polite">
        <span id="typedText"></span><span class="cursor" id="cursor">|</span>
      </p>
      <button type="button" class="open-btn" id="openBtn">View Message</button>
    </div> 
  </div>

  <script>
    const intro = document.getElementById('intro');
    const typedText = document.getElementById('typedText');
    const typedLine = document.getElementById('typedLine');
    const openBtn = document.getElementById('openBtn');
    const introBox = document.getElementById('introBox');
    const matrixCanvas = document.getElementById('matrixCanvas');
    const testScreen = document.getElementById('testScreen');
    const terminalBody = document.getElementById('terminalBody');
    const terminalOutput = document.getElementById('terminalOutput');
    const terminalCursor = document.getElementById('terminalCursor');
    const acceptBox = document.getElementById('acceptBox');
    const acceptYesBtn = document.getElementById('acceptYesBtn');
    const wwiiiScreen = document.getElementById('wwiiiScreen');
    const wwiiiArt = document.getElementById('wwiiiArt');

    const ACCEPT_BOX_DELAY_MS = 2000;

    /**
     * Strokes are 3 chars thick (111). I stem is 5 wide (center).
     * 1 = stroke (toggles 1↔0 each tick), 0 = empty (space).
     */
    const WWIII_LETTER_W = [
      '11100000000111',
      '11100000000111',
      '11100000000111',
      '11100001100111',
      '11100011110111',
      '11100111111111',
      '11101111111111',
      '11111111111111',
      '11111111111111',
      '11111101111111',
      '11111000111111',
      '11110000011111',
      '11100000001111',
      '11100000000111',
    ];
    /** Top/bottom bars 3 rows × full width; vertical stem 5 wide (cols 3–7). */
    const WWIII_LETTER_I = [
      '11111111111',
      '11111111111',
      '11111111111',
      '00011111000',
      '00011111000',
      '00011111000',
      '00011111000',
      '00011111000',
      '00011111000',
      '00011111000',
      '00011111000',
      '11111111111',
      '11111111111',
      '11111111111',
    ];

    let wwiiiIntervalId = null;
    let wwiiiPhase = 0;

    function buildWWIIIPatternRows() {
      const gap = '    ';
      const h = WWIII_LETTER_W.length;
      const rows = [];
      for (let r = 0; r < h; r++) {
        rows.push(
          WWIII_LETTER_W[r] +
            gap +
            WWIII_LETTER_W[r] +
            gap +
            WWIII_LETTER_I[r] +
            gap +
            WWIII_LETTER_I[r] +
            gap +
            WWIII_LETTER_I[r]
        );
      }
      return rows;
    }

    const WWIII_PATTERN_ROWS = buildWWIIIPatternRows();

    function renderWWIIIArt() {
      const phase = wwiiiPhase;
      const lines = WWIII_PATTERN_ROWS.map((row) =>
        row
          .split('')
          .map((ch) => {
            if (ch === '1') return phase % 2 === 0 ? '1' : '0';
            return ' ';
          })
          .join('')
      );
      wwiiiArt.textContent = lines.join('\n');
    }

    function startWWIIIScreen() {
      if (wwiiiIntervalId != null) {
        clearInterval(wwiiiIntervalId);
        wwiiiIntervalId = null;
      }
      wwiiiPhase = 0;
      wwiiiScreen.hidden = false;
      wwiiiScreen.setAttribute('aria-hidden', 'false');
      renderWWIIIArt();
      wwiiiIntervalId = window.setInterval(() => {
        wwiiiPhase += 1;
        renderWWIIIArt();
      }, 1000);
    }

    /** ALL CAPS: type → hold → clear until last line; last line stays (no clear/hide). */
    const TERMINAL_MESSAGES = [
      'ATTENTION: THIS IS AN OFFICIAL TRANSMISSION',
      'A ZOMBIE OUTBREAK HAS OCCURRED',
      'YOU HAVE BEEN SELECTED TO HELP CONTAIN THE OUTBREAK',
      'DO YOU ACCEPT?',
    ];
    const TERMINAL_MESSAGE_HOLD_MS = 1500;
    const TERMINAL_MS_PER_CHAR = 32;

    const line1 = 'You have received a Confidential message.';
    const line2 = 'Would you like to view it?';

    let typeAudioCtx = null;

    function initTypeAudio() {
      if (!typeAudioCtx) {
        typeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (typeAudioCtx.state === 'suspended') {
        typeAudioCtx.resume();
      }
    }

    /** Short RPG-style dialogue blip per visible character (Web Audio, no file). */
    function playDialogueBlip() {
      if (!typeAudioCtx) return;
      const t = typeAudioCtx.currentTime;
      const osc = typeAudioCtx.createOscillator();
      const gain = typeAudioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(680 + Math.random() * 120, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.1, t + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      osc.connect(gain);
      gain.connect(typeAudioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.05);
    }

    function blipForChar(ch) {
      if (!ch || /\s/.test(ch)) return;
      playDialogueBlip();
    }

    function runTypewriter() {
      typedText.textContent = '';
      typedLine.classList.remove('done');
      openBtn.classList.remove('ready');

      let i = 0;
      const msPerChar = 42;

      function tick() {
        if (i < line1.length) {
          const ch = line1[i];
          typedText.textContent += ch;
          blipForChar(ch);
          i++;
          setTimeout(tick, msPerChar);
          return;
        }
        typedText.textContent += '\n\n';
        i = 0;
        function tick2() {
          if (i < line2.length) {
            const ch = line2[i];
            typedText.textContent += ch;
            blipForChar(ch);
            i++;
            setTimeout(tick2, msPerChar);
            return;
          }
          typedLine.classList.add('done');
          openBtn.classList.add('ready');
        }
        tick2();
      }

      setTimeout(tick, 280);
    }

    function showMessage() {
      intro.classList.remove('intro--hidden');
      intro.classList.add('show-box');
      intro.setAttribute('aria-hidden', 'false');
      runTypewriter();
    }

    let matrixRaf = null;
    let matrixResizeHandler = null;

    const BINARY_RAIN_MS = 2000;

    function paintCanvasBlack() {
      const ctx = matrixCanvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;
      matrixCanvas.width = w * dpr;
      matrixCanvas.height = h * dpr;
      matrixCanvas.style.width = w + 'px';
      matrixCanvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function clearTerminalLine() {
      terminalOutput.textContent = '';
      terminalBody.classList.remove('typing-done', 'final-prompt');
    }

    function typeTerminalLine(text, msPerChar) {
      return new Promise((resolve) => {
        terminalOutput.textContent = '';
        terminalBody.classList.remove('typing-done');
        let i = 0;
        const step = () => {
          if (i < text.length) {
            terminalOutput.textContent += text[i];
            blipForChar(text[i]);
            i++;
            setTimeout(step, msPerChar);
          } else {
            terminalBody.classList.add('typing-done');
            resolve();
          }
        };
        step();
      });
    }

    async function runTerminalMessages() {
      terminalBody.classList.remove('final-prompt');
      acceptBox.hidden = true;
      testScreen.setAttribute('aria-hidden', 'false');
      testScreen.hidden = false;
      const lastIndex = TERMINAL_MESSAGES.length - 1;
      for (let m = 0; m < TERMINAL_MESSAGES.length; m++) {
        await typeTerminalLine(TERMINAL_MESSAGES[m], TERMINAL_MS_PER_CHAR);
        if (m < lastIndex) {
          await sleep(TERMINAL_MESSAGE_HOLD_MS);
          clearTerminalLine();
        } else {
          terminalBody.classList.remove('typing-done');
          terminalBody.classList.add('final-prompt');
          window.setTimeout(() => {
            acceptBox.hidden = false;
          }, ACCEPT_BOX_DELAY_MS);
        }
      }
    }

    acceptYesBtn.addEventListener('click', () => {
      acceptBox.hidden = true;
      testScreen.hidden = true;
      testScreen.setAttribute('aria-hidden', 'true');
      matrixCanvas.classList.remove('is-active');
      startWWIIIScreen();
    });

    function showTestScreen() {
      paintCanvasBlack();
      matrixCanvas.classList.add('is-active');
      runTerminalMessages();
    }

    function startBinaryRain() {
      const ctx = matrixCanvas.getContext('2d');
      const cellSize = 16;
      const fallSpeed = 1;
      let phase = 'rain';
      let cols = 0;
      let rows = 0;
      let padX = 0;
      let grid = [];
      let scroll = 0;

      function randomBit() {
        return Math.random() > 0.5 ? '1' : '0';
      }

      function buildGrid() {
        grid = [];
        for (let c = 0; c < cols; c++) {
          grid[c] = [];
          for (let r = 0; r < rows; r++) {
            grid[c][r] = randomBit();
          }
        }
      }

      function resizeRain() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        matrixCanvas.width = w * dpr;
        matrixCanvas.height = h * dpr;
        matrixCanvas.style.width = w + 'px';
        matrixCanvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.floor(w / cellSize);
        rows = Math.ceil(h / cellSize) + 2;
        padX = (w - cols * cellSize) / 2;
        scroll = 0;
        buildGrid();
      }

      function onMatrixResize() {
        if (phase === 'rain') resizeRain();
      }

      if (matrixResizeHandler) {
        window.removeEventListener('resize', matrixResizeHandler);
      }
      matrixResizeHandler = onMatrixResize;
      window.addEventListener('resize', matrixResizeHandler);

      function frame() {
        if (phase !== 'rain') return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.font =
          '600 ' + (cellSize - 3) + 'px ui-monospace, "Cascadia Code", monospace';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#00ff66';

        scroll += fallSpeed;
        if (scroll >= cellSize) {
          scroll -= cellSize;
          for (let c = 0; c < cols; c++) {
            grid[c].shift();
            grid[c].push(randomBit());
          }
        }

        for (let r = 0; r < rows; r++) {
          const y = r * cellSize + scroll + cellSize / 2;
          if (y < -cellSize / 2 || y > h + cellSize / 2) continue;
          for (let c = 0; c < cols; c++) {
            const x = padX + c * cellSize + cellSize / 2;
            ctx.fillText(grid[c][r], x, y);
          }
        }

        matrixRaf = requestAnimationFrame(frame);
      }

      function endRain() {
        phase = 'done';
        if (matrixRaf != null) {
          cancelAnimationFrame(matrixRaf);
          matrixRaf = null;
        }
        showTestScreen();
      }

      resizeRain();
      matrixCanvas.classList.add('is-active');
      matrixRaf = requestAnimationFrame(frame);
      window.setTimeout(endRain, BINARY_RAIN_MS);
    }

    openBtn.addEventListener('click', () => {
      if (!openBtn.classList.contains('ready')) return;
      if (introBox.classList.contains('is-fading-out')) return;
      intro.classList.add('intro--with-matrix');
      startBinaryRain();
      introBox.classList.add('is-fading-out');
    });

    initTypeAudio();
    showMessage();
  </script>
</body>
</html>
