<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pumpkin</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .prompt {
      margin: 0;
      color: #ff8a1f;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: clamp(32px, 5vw, 64px);
      letter-spacing: 0.03em;
      text-align: center;
    }

    body.is-carving .prompt {
      animation: flash 1.1s steps(1, end) infinite;
    }

    body.is-broken .prompt {
      animation: fade-out 0.35s linear forwards;
    }

    .pumpkin-stage {
      position: relative;
      width: min(62vmin, 520px);
      aspect-ratio: 400 / 460;
    }

    .person-layer,
    .pumpkin-stage > .pumpkin {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .person-layer {
      z-index: 0;
      pointer-events: none;
    }

    .pumpkin-stage > .pumpkin {
      z-index: 1;
    }

    .pumpkin-stage.is-broken > .pumpkin {
      visibility: hidden;
    }

    .carve-piece {
      opacity: 0;
    }

    body[data-carve="1"] [data-step="1"],
    body[data-carve="2"] [data-step="1"],
    body[data-carve="2"] [data-step="2"],
    body[data-carve="3"] .carve-piece {
      opacity: 1;
    }

    .shard {
      position: absolute;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
      animation:
        shatter 0.9s cubic-bezier(0.12, 0.75, 0.2, 1) forwards,
        shard-fade 4s linear forwards;
    }

    .shard .pumpkin {
      max-width: none;
    }

    @keyframes flash {
      50% {
        opacity: 0;
      }
    }

    @keyframes fade-out {
      to {
        opacity: 0;
      }
    }

    @keyframes shatter {
      to {
        transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
      }
    }

    @keyframes shard-fade {
      0%, 32% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    body.is-revealed .pumpkin-stage {
      animation: fade-out 0.8s linear forwards;
    }

    .flyer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    body.is-flyer .flyer {
      display: flex;
    }

    .flyer-slot {
      display: block;
      width: auto;
      height: auto;
      max-width: min(86vw, 520px);
      max-height: 92vh;
    }
  </style>
</head>
<body>
  <div class="scene">
    <p class="prompt">Click to carve the punkin</p>
    <div class="pumpkin-stage">
      <svg class="person-layer" viewBox="0 0 400 460" aria-hidden="true">
        <defs>
          <clipPath id="person-clip" clipPathUnits="userSpaceOnUse">
            <ellipse cx="78" cy="258" rx="52" ry="112"/>
            <ellipse cx="322" cy="258" rx="52" ry="112"/>
            <ellipse cx="124" cy="248" rx="78" ry="142"/>
            <ellipse cx="276" cy="248" rx="78" ry="142"/>
            <ellipse cx="200" cy="252" rx="104" ry="162"/>
          </clipPath>
        </defs>
        <image
          href="./person_cutout.svg"
          x="-746.4"
          y="-213"
          width="1874.6"
          height="1586.2"
          preserveAspectRatio="none"
          clip-path="url(#person-clip)"
        />
      </svg>
      <svg class="pumpkin" viewBox="0 0 400 460" role="img" aria-label="Pumpkin">
        <defs>
          <radialGradient id="pumpkin-body" cx="38%" cy="30%" r="72%">
            <stop offset="0%" stop-color="#ffc56a"/>
            <stop offset="32%" stop-color="#ff8a1f"/>
            <stop offset="72%" stop-color="#e25808"/>
            <stop offset="100%" stop-color="#9a3206"/>
          </radialGradient>
          <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#8fce55"/>
            <stop offset="100%" stop-color="#2d6424"/>
          </linearGradient>
          <clipPath id="pumpkin-shape">
            <ellipse cx="78" cy="258" rx="52" ry="112"/>
            <ellipse cx="322" cy="258" rx="52" ry="112"/>
            <ellipse cx="124" cy="248" rx="78" ry="142"/>
            <ellipse cx="276" cy="248" rx="78" ry="142"/>
            <ellipse cx="200" cy="252" rx="104" ry="162"/>
          </clipPath>
          <mask id="pumpkin-holes" maskUnits="userSpaceOnUse">
            <rect x="0" y="0" width="400" height="460" fill="#fff"/>
            <!-- His left eye, his right eye, then the mouth, cut to the feature. -->
            <ellipse class="carve-piece" data-step="1" cx="286" cy="180" rx="36" ry="18" fill="#000" transform="rotate(-6 286 180)"/>
            <ellipse class="carve-piece" data-step="2" cx="112" cy="218" rx="36" ry="18" fill="#000" transform="rotate(-20 112 218)"/>
            <path
              class="carve-piece"
              data-step="3"
              fill="#000"
              transform="translate(-12 0) rotate(-2 245 319)"
              d="M164,332 C196,304 228,290 252,298 C278,290 306,296 326,308 C308,324 276,340 250,338 C220,348 190,344 164,332 Z"
            />
          </mask>
        </defs>

        <g fill="url(#pumpkin-body)" mask="url(#pumpkin-holes)">
          <ellipse cx="78" cy="258" rx="52" ry="112"/>
          <ellipse cx="322" cy="258" rx="52" ry="112"/>
          <ellipse cx="124" cy="248" rx="78" ry="142"/>
          <ellipse cx="276" cy="248" rx="78" ry="142"/>
          <ellipse cx="200" cy="252" rx="104" ry="162"/>
        </g>

        <g fill="none" stroke="#8a2e06" stroke-linecap="round" opacity="0.38" clip-path="url(#pumpkin-shape)" mask="url(#pumpkin-holes)">
          <path d="M150 104 C132 186 134 318 158 408" stroke-width="11"/>
          <path d="M250 104 C268 186 266 318 242 408" stroke-width="11"/>
          <path d="M200 96 C186 190 186 326 200 418" stroke-width="8"/>
        </g>

        <path
          d="M186 112 C180 68 210 34 252 24 C228 46 210 74 208 114 C200 124 190 122 186 112 Z"
          fill="url(#stem)"
        />
        <path
          d="M214 78 C236 70 258 86 268 108"
          fill="none"
          stroke="#3f7a2c"
          stroke-width="7"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </div>
  <div class="flyer">
    <img class="flyer-slot" src="./BOP%20Halloween%20(1).PNG" alt="BOP presents Halloween Party, 10 PM, Saturday, October 31st, House 22">
  </div>

  <script>
    const KNIFE_URL = encodeURI("./Knife Sound Effect ( HD ) No Copyright.mp3");
    const SONG_URL = encodeURI("./Odd Mob, OMNOM, HYPERBEAM - Take You There (Extended Mix).mp3");
    const KNIFE_CUT_SECONDS = 0.4;
    const SONG_START_SECONDS = 70;
    const FLYER_AT_SECONDS = 90;
    const SONG_START_VOLUME = 0.02;
    const SONG_FADE_SECONDS = 20;
    const SHARD_FADE_MS = 4000;
    const OUTLINE_OPEN_MS = 1200;
    const ZOOM_OUT_MS = 14000;
    const CARVE_STEPS = 3;
    const SHARD_COLUMNS = 4;
    const SHARD_ROWS = 5;

    let audioContext = null;
    let songGain = null;
    let knifeBytes = null;
    let knifeBuffer = null;
    let songBytes = null;
    let songBuffer = null;
    let songAudio = null;
    let songStarted = false;
    let songDecodeFailed = false;
    let decodingSong = false;
    let cueTimer = 0;
    let revealReady = false;
    let flyerTimer = 0;
    let carveStep = 0;
    let broken = false;

    /**
     * Drops the leading ID3 tag. This file hides the audio behind about 3MB of
     * tag data, which makes Safari refuse to decode it and report that it cannot seek.
     */
    function stripId3(buffer) {
      const bytes = new Uint8Array(buffer);
      const isId3 = bytes.length >= 10 && bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33;
      if (!isId3) {
        return buffer;
      }

      const size = ((bytes[6] & 0x7f) << 21)
        | ((bytes[7] & 0x7f) << 14)
        | ((bytes[8] & 0x7f) << 7)
        | (bytes[9] & 0x7f);
      const footer = (bytes[5] & 0x10) ? 10 : 0;
      const start = Math.min(buffer.byteLength, 10 + size + footer);
      return buffer.slice(start);
    }

    /** Decodes a copy of the bytes. Safari consumes the buffer it is given. */
    function decodeAudio(bytes) {
      const copy = bytes.slice(0);
      return new Promise((resolve, reject) => {
        let settled = false;
        const finish = (buffer) => {
          if (settled || !buffer) {
            return;
          }
          settled = true;
          resolve(buffer);
        };
        const fail = (error) => {
          if (settled) {
            return;
          }
          settled = true;
          reject(error || new Error("decode"));
        };

        try {
          const result = audioContext.decodeAudioData(copy);
          if (result && typeof result.then === "function") {
            result.then(finish).catch(fail);
            return;
          }
        } catch (error) {
          // Older Safari requires the callback form and consumes the first copy.
        }

        audioContext.decodeAudioData(bytes.slice(0), finish, fail);
      });
    }

    /** Covers the page at 1:30 in the track. The song itself starts at 1:10. */
    function scheduleFlyer() {
      window.clearTimeout(flyerTimer);
      flyerTimer = window.setTimeout(showFlyer, (FLYER_AT_SECONDS - SONG_START_SECONDS) * 1000);
    }

    /** Black screen with the party banner. */
    function showFlyer() {
      document.body.classList.add("is-flyer");
    }

    /** Starts the song element at 1:10 and rises linearly to full volume at the drop. */
    function startSongElement() {
      if (songStarted || !songAudio || !songAudio.src) {
        return;
      }

      songStarted = true;
      let began = false;
      const begin = () => {
        if (began) {
          return;
        }
        began = true;
        scheduleFlyer();
        songAudio.volume = SONG_START_VOLUME;
        const pending = songAudio.play();
        if (pending && typeof pending.catch === "function") {
          pending.catch(() => {
            songStarted = false;
            began = false;
            window.clearTimeout(flyerTimer);
            flyerTimer = 0;
          });
        }
        const started = performance.now();
        const fade = () => {
          const elapsed = (performance.now() - started) / 1000;
          songAudio.volume = Math.min(1, SONG_START_VOLUME + (1 - SONG_START_VOLUME) * (elapsed / SONG_FADE_SECONDS));
          if (elapsed < SONG_FADE_SECONDS) {
            requestAnimationFrame(fade);
          }
        };
        requestAnimationFrame(fade);
      };
      const seek = () => {
        if (Math.abs(songAudio.currentTime - SONG_START_SECONDS) < 0.5) {
          begin();
          return;
        }
        const backup = window.setTimeout(begin, 800);
        songAudio.addEventListener("seeked", () => {
          window.clearTimeout(backup);
          begin();
        }, { once: true });
        songAudio.currentTime = SONG_START_SECONDS;
      };

      if (songAudio.readyState >= 1) {
        seek();
      } else {
        songAudio.addEventListener("loadedmetadata", seek, { once: true });
      }
    }

    /** Plays the decoded song through the audio context at 1:10. */
    function startSongBuffer() {
      if (songStarted || !songBuffer || !audioContext) {
        return;
      }

      songStarted = true;
      const start = () => {
        const source = audioContext.createBufferSource();
        source.buffer = songBuffer;
        source.connect(songGain);
        const now = audioContext.currentTime;
        songGain.gain.cancelScheduledValues(now);
        songGain.gain.setValueAtTime(SONG_START_VOLUME, now);
        songGain.gain.linearRampToValueAtTime(1, now + SONG_FADE_SECONDS);
        source.start(now, SONG_START_SECONDS);
        scheduleFlyer();
      };
      const resumed = audioContext.resume();
      if (resumed && typeof resumed.then === "function") {
        resumed.then(start).catch(start);
      } else {
        start();
      }
    }

    /** Decodes audio that has already been fetched, once Safari has unlocked the context. */
    function decodeLoadedAudio() {
      if (!audioContext || audioContext.state === "suspended") {
        return;
      }

      if (knifeBytes && !knifeBuffer) {
        const bytes = knifeBytes;
        knifeBytes = null;
        decodeAudio(bytes).then((buffer) => {
          knifeBuffer = buffer;
        }).catch(() => {});
      }

      if (!songBytes || songBuffer || decodingSong) {
        return;
      }

      decodingSong = true;
      decodeAudio(songBytes).then((buffer) => {
        songBuffer = buffer;
        cueMusic();
      }).catch(() => {
        songDecodeFailed = true;
        decodingSong = false;
        cueMusic();
      });
    }

    /**
     * Creates the audio context from the click. Safari stays silent if the
     * context is created or resumed outside a user gesture.
     */
    function ensureContext() {
      if (!audioContext) {
        const Context = window.AudioContext || window.webkitAudioContext;
        audioContext = new Context();
        songGain = audioContext.createGain();
        songGain.connect(audioContext.destination);
        const silent = audioContext.createBuffer(1, 1, 22050);
        const blip = audioContext.createBufferSource();
        blip.buffer = silent;
        blip.connect(audioContext.destination);
        blip.start(0);
      }

      const resumed = audioContext.resume();
      if (resumed && typeof resumed.then === "function") {
        resumed.then(decodeLoadedAudio);
      }
      decodeLoadedAudio();
    }

    /** Unlocks the audio context on a click without starting the song. */
    function unlockAudio() {
      ensureContext();
    }

    fetch(KNIFE_URL)
      .then((response) => response.arrayBuffer())
      .then((audioData) => {
        knifeBytes = audioData;
        decodeLoadedAudio();
      })
      .catch(() => {});

    fetch(SONG_URL)
      .then((response) => {
        if (!response.ok) {
          throw new Error("song");
        }
        return response.arrayBuffer();
      })
      .then((audioData) => {
        songBytes = stripId3(audioData);
        songAudio = songAudio || new Audio();
        songAudio.preload = "auto";
        if (!songStarted) {
          songAudio.src = URL.createObjectURL(new Blob([songBytes], { type: "audio/mpeg" }));
        }
        decodeLoadedAudio();
        cueMusic();
      })
      .catch(() => {
        songDecodeFailed = true;
        songAudio = songAudio || new Audio(SONG_URL);
        songAudio.preload = "auto";
        cueMusic();
      });

    /** Starts the song at one minute once the pumpkin has disappeared. */
    function cueMusic() {
      if (songStarted || !revealReady) {
        return;
      }

      if (songBuffer && audioContext) {
        window.clearTimeout(cueTimer);
        cueTimer = 0;
        startSongBuffer();
        return;
      }

      if (songDecodeFailed) {
        window.clearTimeout(cueTimer);
        cueTimer = 0;
        startSongElement();
        return;
      }

      if (!cueTimer) {
        cueTimer = window.setTimeout(() => {
          cueTimer = 0;
          if (songStarted || !revealReady) {
            return;
          }
          if (songBuffer && audioContext) {
            startSongBuffer();
          } else {
            startSongElement();
          }
        }, 2000);
      }
    }

    /** Eases the zoom so the face pulls back into the full picture. */
    function easeInOut(progress) {
      return progress < 0.5
        ? 2 * progress * progress
        : 1 - ((-2 * progress + 2) ** 2) / 2;
    }

    /** Fades the pumpkin outline into the rectangular photo, then zooms. */
    function openPumpkinOutline() {
      const layer = document.querySelector(".person-layer");
      const image = layer.querySelector("image");
      const box = image.cloneNode(true);
      box.removeAttribute("clip-path");
      box.setAttribute("opacity", "0");
      image.after(box);

      const started = performance.now();
      function frame(now) {
        const progress = Math.min((now - started) / OUTLINE_OPEN_MS, 1);
        box.setAttribute("opacity", String(easeInOut(progress)));
        if (progress < 1) {
          requestAnimationFrame(frame);
          return;
        }

        box.remove();
        image.removeAttribute("clip-path");
        zoomOutPerson();
        document.body.classList.add("is-revealed");
      }
      requestAnimationFrame(frame);
    }

    /** Zooms the same photo out from the face to the full cutout. */
    function zoomOutPerson() {
      const layer = document.querySelector(".person-layer");
      const image = layer.querySelector("image");
      const stage = document.querySelector(".pumpkin-stage");
      const stageRect = stage.getBoundingClientRect();
      image.removeAttribute("clip-path");
      layer.style.clipPath = "none";
      layer.setAttribute("preserveAspectRatio", "none");

      const fromBox = { x: 0, y: 0, w: 400, h: 460 };
      const fromFrame = {
        left: stageRect.left,
        top: stageRect.top,
        width: stageRect.width,
        height: stageRect.height
      };
      const imageX = Number(image.getAttribute("x"));
      const imageY = Number(image.getAttribute("y"));
      const imageW = Number(image.getAttribute("width"));
      const imageH = Number(image.getAttribute("height"));
      const viewAspect = window.innerWidth / window.innerHeight;
      let viewW = imageW / 0.9;
      let viewH = viewW / viewAspect;
      if (imageH > viewH * 0.92) {
        viewH = imageH / 0.92;
        viewW = viewH * viewAspect;
      }
      const toBox = {
        x: imageX - (viewW - imageW) / 2,
        y: imageY - (viewH - imageH) / 2,
        w: viewW,
        h: viewH
      };
      const toFrame = {
        left: 0,
        top: 0,
        width: window.innerWidth,
        height: window.innerHeight
      };

      document.body.appendChild(layer);
      layer.style.position = "fixed";
      layer.style.margin = "0";
      layer.style.right = "auto";
      layer.style.bottom = "auto";
      layer.style.zIndex = "6";

      const started = performance.now();
      function frame(now) {
        const progress = Math.min((now - started) / ZOOM_OUT_MS, 1);
        const eased = easeInOut(progress);
        const mix = (start, end) => start + (end - start) * eased;
        layer.style.left = `${mix(fromFrame.left, toFrame.left)}px`;
        layer.style.top = `${mix(fromFrame.top, toFrame.top)}px`;
        layer.style.width = `${mix(fromFrame.width, toFrame.width)}px`;
        layer.style.height = `${mix(fromFrame.height, toFrame.height)}px`;
        layer.setAttribute("viewBox", [
          mix(fromBox.x, toBox.x),
          mix(fromBox.y, toBox.y),
          mix(fromBox.w, toBox.w),
          mix(fromBox.h, toBox.h)
        ].join(" "));
        if (progress < 1) {
          requestAnimationFrame(frame);
        }
      }
      requestAnimationFrame(frame);
    }

    /** Starts the song at the break, then opens the outline and zooms. */
    function revealPerson() {
      revealReady = true;
      cueMusic();
      window.setTimeout(openPumpkinOutline, SHARD_FADE_MS);
    }

    /** Plays the first 0.4 seconds of the knife cut. */
    function playKnifeCut() {
      if (!knifeBuffer || !audioContext) {
        const cut = new Audio(KNIFE_URL);
        const pending = cut.play();
        if (pending && typeof pending.catch === "function") {
          pending.catch(() => {});
        }
        window.setTimeout(() => cut.pause(), KNIFE_CUT_SECONDS * 1000);
        return;
      }

      audioContext.resume();
      const source = audioContext.createBufferSource();
      source.buffer = knifeBuffer;
      source.connect(audioContext.destination);
      source.start(0, 0, KNIFE_CUT_SECONDS);
    }

    /**
     * Copies the pumpkin with its own gradient and mask.
     * Pieces that borrow the hidden pumpkin's paint stay blank in Safari.
     */
    function clonePumpkinPiece(svg, index) {
      const clone = svg.cloneNode(true);
      const suffix = `-piece-${index}`;
      clone.querySelectorAll("[id]").forEach((node) => {
        node.setAttribute("id", `${node.getAttribute("id")}${suffix}`);
      });
      clone.querySelectorAll("*").forEach((node) => {
        ["fill", "stroke", "mask", "clip-path"].forEach((name) => {
          const value = node.getAttribute(name);
          if (!value || value.indexOf("url(#") === -1) {
            return;
          }
          node.setAttribute(name, value.replace(/url\(#([^)]+)\)/g, (_, id) => `url(#${id}${suffix})`));
        });
      });
      return clone;
    }

    /** Cuts the finished pumpkin into pieces and hides the prompt. */
    function shatterPumpkin() {
      if (broken) {
        return;
      }

      broken = true;
      const stage = document.querySelector(".pumpkin-stage");
      const svg = stage.querySelector(".pumpkin");
      const reach = stage.getBoundingClientRect().width;
      document.body.classList.add("is-broken");
      stage.classList.add("is-broken");
      if (audioContext) {
        audioContext.resume();
      }
      let piece = 0;
      for (let row = 0; row < SHARD_ROWS; row += 1) {
        for (let column = 0; column < SHARD_COLUMNS; column += 1) {
          const shard = document.createElement("div");
          shard.className = "shard";
          shard.style.left = `${(column / SHARD_COLUMNS) * 100}%`;
          shard.style.top = `${(row / SHARD_ROWS) * 100}%`;
          shard.style.width = `${100 / SHARD_COLUMNS}%`;
          shard.style.height = `${100 / SHARD_ROWS}%`;

          const clone = clonePumpkinPiece(svg, piece);
          piece += 1;
          clone.style.position = "absolute";
          clone.style.width = `${SHARD_COLUMNS * 100}%`;
          clone.style.height = `${SHARD_ROWS * 100}%`;
          clone.style.left = `${-column * 100}%`;
          clone.style.top = `${-row * 100}%`;
          shard.appendChild(clone);

          const centerX = (column + 0.5) / SHARD_COLUMNS - 0.5;
          const centerY = (row + 0.5) / SHARD_ROWS - 0.5;
          let dx = centerX * reach * 1.85;
          let dy = centerY * reach * 1.55;
          if (Math.hypot(centerX, centerY) < 0.18) {
            const angle = Math.random() * Math.PI * 2;
            const distance = reach * (0.42 + Math.random() * 0.28);
            dx = Math.cos(angle) * distance;
            dy = Math.sin(angle) * distance;
          }

          shard.style.setProperty("--dx", `${(dx + (Math.random() - 0.5) * reach * 0.22).toFixed(1)}px`);
          shard.style.setProperty("--dy", `${(dy + (Math.random() - 0.5) * reach * 0.18).toFixed(1)}px`);
          shard.style.setProperty("--rot", `${Math.round((Math.random() - 0.5) * 520)}deg`);
          stage.appendChild(shard);
        }
      }

      revealPerson();
    }

    /** Advances the face, then breaks the pumpkin on the click after the mouth. */
    function carve() {
      if (broken) {
        return;
      }

      if (carveStep >= CARVE_STEPS) {
        playKnifeCut();
        shatterPumpkin();
        return;
      }

      carveStep += 1;
      document.body.dataset.carve = String(carveStep);
      document.body.classList.add("is-carving");
      playKnifeCut();
    }

    document.addEventListener("pointerdown", () => {
      unlockAudio();
      carve();
    });
    document.addEventListener("touchend", unlockAudio);
  </script>
</body>
</html>
