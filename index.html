<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* —— Confidential message —— */
    .intro {
      z-index: 10;
      background: #000;
      transition: opacity 0.35s ease, visibility 0.35s;
    }

    .intro.intro--hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .intro-box {
      width: min(92vw, 420px);
      padding: 1.75rem 1.5rem;
      background: #6e6e6e;
      border: 1px solid #555;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      opacity: 0;
      transform: scale(0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro.show-box .intro-box {
      animation: boxPop 0.35s ease forwards;
    }

    /* Instant hide (overrides boxPop fill) */
    .intro.show-box .intro-box.is-fading-out {
      animation: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none;
    }

    @keyframes boxPop {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .intro-text {
      font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: clamp(13px, 3.2vw, 15px);
      line-height: 1.55;
      color: #111;
      min-height: 4.5em;
      white-space: pre-wrap;
      text-align: center;
      width: 100%;
    }

    .intro-text .cursor {
      display: inline-block;
      animation: blink 0.85s step-end infinite;
      margin-left: 1px;
    }

    .intro-text.done .cursor {
      display: none;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .open-btn {
      margin-top: 1.25rem;
      padding: 0.55rem 1.35rem;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: #2a2a2a;
      color: #eee;
      border: 1px solid #1a1a1a;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: background 0.2s, opacity 0.35s ease;
    }

    .open-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }

    .open-btn.ready:hover {
      background: #3a3a3a;
    }

    /* —— Matrix-style binary rain —— */
    .matrix-canvas {
      position: fixed;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .matrix-canvas.is-active {
      opacity: 1;
    }

    .intro.intro--with-matrix {
      background: transparent;
    }

    /* —— TEST (final) —— */
    .test-screen {
      position: fixed;
      inset: 0;
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .test-screen[hidden] {
      display: none !important;
    }

    .test-title {
      font-family: Impact, "Arial Black", ui-sans-serif, system-ui, sans-serif;
      font-weight: 900;
      font-size: min(22vw, 200px);
      line-height: 1;
      color: #00ff66;
      text-align: center;
    }

  </style>
</head>
<body>
  <canvas id="matrixCanvas" class="matrix-canvas" aria-hidden="true"></canvas>

  <div id="testScreen" class="test-screen" hidden aria-hidden="true">
    <h1 class="test-title">TEST</h1>
  </div>

  <div class="scene intro intro--hidden" id="intro" aria-hidden="true">
    <div class="intro-box" id="introBox">
      <p class="intro-text" id="typedLine" aria-live="polite">
        <span id="typedText"></span><span class="cursor" id="cursor">|</span>
      </p>
      <button type="button" class="open-btn" id="openBtn">View Message</button>
    </div> 
  </div>

  <script>
    const intro = document.getElementById('intro');
    const typedText = document.getElementById('typedText');
    const typedLine = document.getElementById('typedLine');
    const openBtn = document.getElementById('openBtn');
    const introBox = document.getElementById('introBox');
    const matrixCanvas = document.getElementById('matrixCanvas');
    const testScreen = document.getElementById('testScreen');

    const line1 = 'You have received a Confidential message.';
    const line2 = 'Would you like to view it?';

    let typeAudioCtx = null;

    function initTypeAudio() {
      if (!typeAudioCtx) {
        typeAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (typeAudioCtx.state === 'suspended') {
        typeAudioCtx.resume();
      }
    }

    /** Short RPG-style dialogue blip per visible character (Web Audio, no file). */
    function playDialogueBlip() {
      if (!typeAudioCtx) return;
      const t = typeAudioCtx.currentTime;
      const osc = typeAudioCtx.createOscillator();
      const gain = typeAudioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(680 + Math.random() * 120, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.1, t + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
      osc.connect(gain);
      gain.connect(typeAudioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.05);
    }

    function blipForChar(ch) {
      if (!ch || /\s/.test(ch)) return;
      playDialogueBlip();
    }

    function runTypewriter() {
      typedText.textContent = '';
      typedLine.classList.remove('done');
      openBtn.classList.remove('ready');

      let i = 0;
      const msPerChar = 42;

      function tick() {
        if (i < line1.length) {
          const ch = line1[i];
          typedText.textContent += ch;
          blipForChar(ch);
          i++;
          setTimeout(tick, msPerChar);
          return;
        }
        typedText.textContent += '\n\n';
        i = 0;
        function tick2() {
          if (i < line2.length) {
            const ch = line2[i];
            typedText.textContent += ch;
            blipForChar(ch);
            i++;
            setTimeout(tick2, msPerChar);
            return;
          }
          typedLine.classList.add('done');
          openBtn.classList.add('ready');
        }
        tick2();
      }

      setTimeout(tick, 280);
    }

    function showMessage() {
      intro.classList.remove('intro--hidden');
      intro.classList.add('show-box');
      intro.setAttribute('aria-hidden', 'false');
      runTypewriter();
    }

    let matrixRaf = null;
    let matrixResizeHandler = null;

    const BINARY_RAIN_MS = 3000;

    function paintCanvasBlack() {
      const ctx = matrixCanvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;
      matrixCanvas.width = w * dpr;
      matrixCanvas.height = h * dpr;
      matrixCanvas.style.width = w + 'px';
      matrixCanvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
    }

    function showTestScreen() {
      paintCanvasBlack();
      matrixCanvas.classList.add('is-active');
      testScreen.hidden = false;
      testScreen.setAttribute('aria-hidden', 'false');
    }

    function startBinaryRain() {
      const ctx = matrixCanvas.getContext('2d');
      const cellSize = 16;
      const fallSpeed = 1;
      let phase = 'rain';
      let cols = 0;
      let rows = 0;
      let padX = 0;
      let grid = [];
      let scroll = 0;

      function randomBit() {
        return Math.random() > 0.5 ? '1' : '0';
      }

      function buildGrid() {
        grid = [];
        for (let c = 0; c < cols; c++) {
          grid[c] = [];
          for (let r = 0; r < rows; r++) {
            grid[c][r] = randomBit();
          }
        }
      }

      function resizeRain() {
        const dpr = window.devicePixelRatio || 1;
        const w = window.innerWidth;
        const h = window.innerHeight;
        matrixCanvas.width = w * dpr;
        matrixCanvas.height = h * dpr;
        matrixCanvas.style.width = w + 'px';
        matrixCanvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cols = Math.floor(w / cellSize);
        rows = Math.ceil(h / cellSize) + 2;
        padX = (w - cols * cellSize) / 2;
        scroll = 0;
        buildGrid();
      }

      function onMatrixResize() {
        if (phase === 'rain') resizeRain();
      }

      if (matrixResizeHandler) {
        window.removeEventListener('resize', matrixResizeHandler);
      }
      matrixResizeHandler = onMatrixResize;
      window.addEventListener('resize', matrixResizeHandler);

      function frame() {
        if (phase !== 'rain') return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);
        ctx.font =
          '600 ' + (cellSize - 3) + 'px ui-monospace, "Cascadia Code", monospace';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#00ff66';

        scroll += fallSpeed;
        if (scroll >= cellSize) {
          scroll -= cellSize;
          for (let c = 0; c < cols; c++) {
            grid[c].shift();
            grid[c].push(randomBit());
          }
        }

        for (let r = 0; r < rows; r++) {
          const y = r * cellSize + scroll + cellSize / 2;
          if (y < -cellSize / 2 || y > h + cellSize / 2) continue;
          for (let c = 0; c < cols; c++) {
            const x = padX + c * cellSize + cellSize / 2;
            ctx.fillText(grid[c][r], x, y);
          }
        }

        matrixRaf = requestAnimationFrame(frame);
      }

      function endRain() {
        phase = 'done';
        if (matrixRaf != null) {
          cancelAnimationFrame(matrixRaf);
          matrixRaf = null;
        }
        showTestScreen();
      }

      resizeRain();
      matrixCanvas.classList.add('is-active');
      matrixRaf = requestAnimationFrame(frame);
      window.setTimeout(endRain, BINARY_RAIN_MS);
    }

    openBtn.addEventListener('click', () => {
      if (!openBtn.classList.contains('ready')) return;
      if (introBox.classList.contains('is-fading-out')) return;
      intro.classList.add('intro--with-matrix');
      startBinaryRain();
      introBox.classList.add('is-fading-out');
    });

    initTypeAudio();
    showMessage();
  </script>
</body>
</html>
