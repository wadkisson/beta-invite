<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .doors {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 3;
    }

    .doors.approaching {
      animation: doorsApproach 1.2s cubic-bezier(0.2, 0.6, 0.4, 1) forwards;
      pointer-events: none;
    }

    .doors.approaching .door {
      animation: doorsFadeOut 0.6s 0.4s ease-out forwards;
    }

    @keyframes doorsApproach {
      from { transform: translate(-50%, -50%) scale(1); }
      to { transform: translate(-50%, -50%) scale(12); }
    }

    @keyframes doorsFadeOut {
      to { opacity: 0; }
    }

    .door {
      width: 200px;
      height: 300px;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .door:hover {
      opacity: 0.9;
    }

    .white-reveal {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .white-reveal.visible {
      animation: revealFadeIn 0.8s 0.3s ease-out forwards;
    }

    @keyframes revealFadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="white-reveal" id="whiteReveal"></div>
  <div class="doors" id="doors">
    <img class="door" src="door.png" alt="">
  </div>

  <script>
    const doors = document.getElementById('doors');
    const whiteReveal = document.getElementById('whiteReveal');

    doors.addEventListener('click', () => {
      doors.classList.add('approaching');
      whiteReveal.classList.add('visible');
    });
  </script>
</body>
</html>
